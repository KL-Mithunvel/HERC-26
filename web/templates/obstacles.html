<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>MOVIS – Obstacles</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --bg: #0b0f14;
      --panel: #101826;
      --panel2: #0e1622;
      --border: rgba(255,255,255,0.08);
      --text: #e8eef6;
      --muted: rgba(232,238,246,0.65);
      --accent: #6ae4ff;
      --good: #22c55e;
      --bad: #ef4444;
      --warn: #f59e0b;
      --shadow: 0 10px 30px rgba(0,0,0,0.35);
      --radius: 14px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 20% 0%, rgba(106,228,255,0.10), transparent 60%),
                  radial-gradient(900px 500px at 80% 10%, rgba(34,197,94,0.08), transparent 60%),
                  var(--bg);
      color: var(--text);
    }

    .wrap { padding: 18px; max-width: 1400px; margin: 0 auto; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .brand h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0.8px;
      font-weight: 700;
    }

    .meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      font-family: var(--mono);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn {
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
      color: var(--text);
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: var(--shadow);
      font-weight: 600;
      transition: transform 0.08s ease;
    }
    .btn:active { transform: translateY(1px); }
    .btn.primary { border-color: rgba(106,228,255,0.35); }
    .btn.danger { border-color: rgba(239,68,68,0.35); }

    .pill {
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
      display: inline-flex;
      gap: 8px;
      align-items: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 14px;
    }

    .card {
      grid-column: span 4;
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .card .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 12px 10px 12px;
      border-bottom: 1px solid var(--border);
      background: rgba(0,0,0,0.18);
    }

    .card .title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    /* Bigger LED */
    .led {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--bad);
      box-shadow:
        0 0 0 3px rgba(255,255,255,0.04),
        0 0 16px rgba(239,68,68,0.35);
      flex: 0 0 auto;
    }
    .led.good {
      background: var(--good);
      box-shadow:
        0 0 0 3px rgba(255,255,255,0.04),
        0 0 18px rgba(34,197,94,0.38);
    }
    .led.warn {
      background: var(--warn);
      box-shadow:
        0 0 0 3px rgba(255,255,255,0.04),
        0 0 18px rgba(245,158,11,0.35);
    }

    .card .body { padding: 12px; }

    .kv {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px 14px;
      font-family: var(--mono);
      font-size: 13px;
      color: var(--text);
    }
    .k { color: var(--muted); }
    .v { text-align: right; }

    .sub {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed rgba(255,255,255,0.10);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.35;
      white-space: pre-wrap;
    }

    .wide { grid-column: span 12; }
    .span6 { grid-column: span 6; }
    .span4 { grid-column: span 4; }
    .span3 { grid-column: span 3; }

    textarea {
      width: 100%;
      min-height: 160px;
      resize: vertical;
      background: rgba(0,0,0,0.25);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.35;
      outline: none;
    }

    @media (max-width: 1100px) {
      .card { grid-column: span 6; }
      .span6 { grid-column: span 12; }
    }
    @media (max-width: 700px) {
      .card { grid-column: span 12; }
    }
  </style>
</head>

<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <h1>TEAM MOVIS – OBSTACLE MODE</h1>
      <div class="meta" id="meta">--</div>
    </div>

    <div class="controls">
      <button class="btn primary" id="runOn">RUN ON</button>
      <button class="btn danger" id="runOff">RUN OFF</button>
      <div class="pill"><span>RUN</span><strong id="runState">--</strong></div>
      <a class="btn" href="/">Sensors Only</a>
    </div>
  </div>

  <div class="grid">

    <!-- Obstacle Control -->
    <div class="card span6">
      <div class="head">
        <div class="title">Obstacle Marker</div>
      </div>
      <div class="body">

        <div class="kv">
          <div class="k">Obstacle</div>
          <div class="v">
            <select id="obstacle_id" class="select">
              <option value="1">Obstacle 1</option>
              <option value="2">Obstacle 2</option>
              <option value="3">Obstacle 3</option>
              <option value="4">Obstacle 4</option>
              <option value="5">Obstacle 5</option>
              <option value="6">Obstacle 6</option>
              <option value="7">Obstacle 7</option>
              <option value="8">Obstacle 8</option>
              <option value="9">Obstacle 9</option>
              <option value="10">Obstacle 10</option>
            </select>
          </div>

          <div class="k">Action</div>
          <div class="v">
            <select id="action" class="select">
              <option value="enter">ENTER</option>
              <option value="exit">EXIT</option>
              <option value="bypass">BYPASS</option>
            </select>
          </div>
        </div>

        <div style="margin-top:12px;">
          <button class="btn primary" id="saveEvent">SAVE</button>
          <div class="sub" id="event_msg"></div>
        </div>
      </div>
    </div>

    <!-- Everything else (sensors, validation, status) -->
    <!-- EXACTLY the same cards as index.html -->
    <!-- COPY the rest of your dashboard cards here unchanged -->

  </div>
</div>

<script src="/static/app.js"></script>
<script src="/static/obstacles.js"></script>
</body>
</html>
